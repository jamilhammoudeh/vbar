[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vbar"
dynamic = ["version"]
description = "Headless benchmark for classical, reinforcement learning and LLM spacecraft rendezvous controllers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jamil Hammoudeh", email = "j.hammoudeh@outlook.com" }]
keywords = [
    "spacecraft", "rendezvous", "proximity operations", "guidance navigation and control",
    "benchmark", "reinforcement learning", "safety filter", "clohessy-wiltshire", "orbital mechanics",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
]

[project.urls]
Homepage = "https://github.com/jamilhammoudeh/vbar"
Repository = "https://github.com/jamilhammoudeh/vbar"
Issues = "https://github.com/jamilhammoudeh/vbar/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "build>=1.2",
    "matplotlib>=3.8",
]

[tool.hatch.version]
path = "src/vbar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
