[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vbar"
dynamic = ["version"]
description = "Headless benchmark for classical, reinforcement learning and LLM spacecraft rendezvous controllers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jamil Hammoudeh", email = "j.hammoudeh@outlook.com" }]
keywords = [
    "spacecraft", "rendezvous", "proximity operations", "guidance navigation and control",
    "benchmark", "reinforcement learning", "safety filter", "clohessy-wiltshire", "orbital mechanics",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
]

[project.urls]
Homepage = "https://github.com/jamilhammoudeh/vbar"
Repository = "https://github.com/jamilhammoudeh/vbar"
Issues = "https://github.com/jamilhammoudeh/vbar/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "build>=1.2",
    "matplotlib>=3.8",
]

[tool.hatch.version]
path = "src/vbar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Whole-episode audits take most of an hour; CI runs them in their own job with `-m slow`.
addopts = "-m 'not slow'"
markers = ["slow: whole-episode scenario audits, left out unless asked for with -m slow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["scipy.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = [
    "src/vbar/dynamics/cw.py",
    "src/vbar/dynamics/kepler.py",
    "src/vbar/dynamics/mean_elements.py",
    "src/vbar/spacecraft/propulsion.py",
    "src/vbar/constraints.py",
    "src/vbar/solvers/qp.py",
    "src/vbar/solvers/ipm.py",
    "src/vbar/solvers/stage.py",
    "src/vbar/solvers/scaling.py",
    "src/vbar/scenarios/seeds.py",
    "src/vbar/scenarios/spec.py",
    "src/vbar/metrics/episode.py",
    "src/vbar/metrics/stl.py",
    "src/vbar/metrics/safety.py",
    "src/vbar/metrics/efficiency.py",
]
also_copy = ["src", "CITATION.cff", "pyproject.toml", "README.md", "docs", "examples"]
# Stats, clean and mutant runs each start from a process that has only collected the tests; with
# plain fork, state a test leaves behind in the stats run leaks into every mutant's run.
process_isolation = "forkserver"
# The package is not installed for mutation runs, so a fresh `python -m vbar...` process cannot
# import it; those two tests run no mutated code in the test process anyway.
pytest_add_cli_args = [
    "--ignore=tests/test_docs.py",
    "-p",
    "no:cacheprovider",
    "--deselect=tests/test_mcp.py::test_command_line_server_speaks_json_rpc_on_stdio",
    "--deselect=tests/test_mcp.py::test_the_command_line_draws_unguessable_seeds_unless_given_some",
]
