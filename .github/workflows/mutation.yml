name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  mutation:
    # Mirrors used for pre-merge CI would otherwise run this weekly on their own minutes.
    if: github.repository == 'jamilhammoudeh/vbar'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # No install of the package itself: the tests must import mutmut's mutated copy.
      - run: python -m pip install numpy scipy gymnasium pytest hypothesis "mutmut==3.8.0"
      - run: mutmut run
      - run: mutmut results
