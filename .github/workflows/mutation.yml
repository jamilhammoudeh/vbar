name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No install of the package itself: the tests must import mutmut's mutated copy.
      - run: python -m pip install numpy scipy gymnasium pytest hypothesis "mutmut==3.8.0"
      - run: mutmut run
      - run: mutmut results
