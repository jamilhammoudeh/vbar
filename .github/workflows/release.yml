name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      # A release tagged v0.1.0 has to build vbar 0.1.0.
      - run: test -f "dist/vbar-${GITHUB_REF_NAME#v}.tar.gz"
      # Test the built wheel rather than the source tree.
      - run: python -m pip install dist/*.whl "pytest>=8" "hypothesis>=6.100"
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
